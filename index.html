<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#72e3ad" />
  <meta name="description" content="Respira by GestorPro — controle financeiro pessoal." />
  <meta name="robots" content="noindex,nofollow" />
  <title>Respira — by GestorPro</title>
  <link rel="icon" href="assets/logos/gestorpro-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/logos/gestorpro-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <noscript>Ative o JavaScript para usar o Respira.</noscript>

  <div id="boot-screen" class="boot-screen" aria-live="polite">
    <img class="brand-logo" src="assets/logos/gestorpro-symbol.png" alt="" width="56" height="56" />
    <strong>Respira</strong>
    <span>by Gestor<span class="brand-pro">Pro</span></span>
  </div>

  <div id="lock-screen" class="lock-screen hidden" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <div class="lock-card">
      <img class="brand-logo brand-logo--lg" src="assets/logos/gestorpro-symbol.png" alt="GestorPro" width="72" height="72" />
      <h1 id="lock-title">Respira</h1>
      <p class="byline">by Gestor<span class="brand-pro">Pro</span></p>
      <p id="lock-copy" class="muted">financeiro.gestorpro.sbs</p>
      <form id="unlock-form" class="stack" autocomplete="off">
        <label class="field">
          <span>PIN</span>
          <input id="unlock-pin" inputmode="numeric" type="password" minlength="4" maxlength="12" autocomplete="current-password" required />
        </label>
        <button class="button button--primary button--large" type="submit">Entrar</button>
      </form>
      <p id="unlock-error" class="form-error hidden" role="alert"></p>
    </div>
  </div>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar" aria-label="Navegação">
      <a href="#overview" class="brand-row sidebar-brand" data-nav="overview">
        <img class="brand-logo" src="assets/logos/gestorpro-symbol.png" alt="" width="32" height="32" />
        <div><strong>Respira</strong><small>by Gestor<span class="brand-pro">Pro</span></small></div>
      </a>
      <nav class="nav-list">
        <button class="nav-item active" data-view="overview" type="button"><span>⌂</span><span>Geral</span></button>
        <button class="nav-item" data-view="month" type="button"><span>▤</span><span>Mês</span></button>
        <button class="nav-item" data-view="commitments" type="button"><span>◎</span><span>Fixos</span></button>
        <button class="nav-item" data-view="debts" type="button"><span>◈</span><span>Dívidas</span></button>
        <button class="nav-item" data-view="history" type="button"><span>⌁</span><span>Passado</span></button>
        <button class="nav-item" data-view="settings" type="button"><span>⚙</span><span>Ajustes</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="privacy-note"><span class="status-dot" id="sync-dot"></span><span id="sync-label">Nuvem</span></div>
        <button id="lock-now" class="button button--ghost button--full" type="button">Bloquear</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="view-eyebrow">HOJE</p>
          <h1 id="view-title">Visão geral</h1>
        </div>
        <div class="topbar-actions">
          <div class="month-nav" role="group" aria-label="Escolher mês">
            <button id="month-prev" class="month-nav__btn" type="button" aria-label="Mês anterior">‹</button>
            <button id="month-label" class="month-nav__label" type="button" title="Ir para o mês atual">jul. de 2026</button>
            <button id="month-next" class="month-nav__btn" type="button" aria-label="Próximo mês">›</button>
            <button id="month-today" class="month-nav__today hidden" type="button">Este mês</button>
          </div>
          <button id="install-app" class="button button--secondary hidden" type="button">Instalar</button>
          <button id="quick-add" class="button button--primary" type="button"><span aria-hidden="true">+</span>Adicionar</button>
        </div>
      </header>
      <div id="toast-region" class="toast-region" aria-live="polite"></div>
      <section id="view-root" class="view-root" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="entity-dialog" class="dialog">
    <form id="entity-form" method="dialog" class="dialog-card">
      <div class="dialog-header">
        <div><p id="dialog-eyebrow" class="eyebrow">ADICIONAR</p><h2 id="dialog-title">Novo</h2></div>
        <button class="icon-button" type="button" data-close-dialog aria-label="Fechar">×</button>
      </div>
      <div id="dialog-fields" class="dialog-fields"></div>
      <p id="dialog-error" class="form-error hidden" role="alert"></p>
      <div class="dialog-actions">
        <button class="button button--ghost" type="button" data-close-dialog>Cancelar</button>
        <button id="dialog-submit" class="button button--primary" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog dialog--small">
    <form method="dialog" class="dialog-card">
      <div class="dialog-header"><div><p class="eyebrow">CONFIRMAÇÃO</p><h2 id="confirm-title">Tem certeza?</h2></div></div>
      <p id="confirm-copy" class="muted"></p>
      <div class="dialog-actions">
        <button class="button button--ghost" value="cancel">Cancelar</button>
        <button id="confirm-action" class="button button--danger" value="confirm">Confirmar</button>
      </div>
    </form>
  </dialog>

  <input id="import-file" class="visually-hidden" type="file" accept="application/json,.json" />
  <script type="module" src="js/app.js"></script>
</body>
</html>
